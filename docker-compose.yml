services:
  postgresdb:
    image: postgres:16
    container_name: CLINICA_POSTGRESDB
    restart: always
    environment:
      POSTGRES_USER: clinica_user
      POSTGRES_PASSWORD: clinica_password
      POSTGRES_DB: clinica_bot_db
    ports:
      - "5432:5432"
    volumes:
      - clinica_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: CLINICA_PGADMIN
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@clinica.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgresdb

volumes:
  clinica_pgdata: